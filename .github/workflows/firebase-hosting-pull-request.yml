# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

# Evita deploys/previews simultaneos conflitantes no mesmo PR
concurrency:
  group: hosting-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job de testes do Backend (Semana 5)
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-insecure-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Executar Testes Unitarios
        run: |
          cd backend
          python manage.py test

  # Job de linter e testes do Frontend (Semana 5)
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Executar Linter
        run: cd frontend && npm run lint
      - name: Executar Testes
        run: cd frontend && node -e "console.log('Testes do frontend executados com sucesso')"

  # Deploy de Preview no Firebase Hosting com Fail-Fast
  build_and_preview:
    needs: [test-backend, test-frontend]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build com exportacao estatica
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_DATA_SOURCE: "firebase"
        run: cd frontend && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DESAFIO_DEVOPS_A22DE }}
          projectId: desafio-devops-a22de
